<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control Personal - ITLM</title>
    <link rel="stylesheet" href="../estilos/panel-personal-estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="admin-header">
        <div class="header-titles">
            <h1>Panel de Control - Personal</h1>
            <h2>Instituto Tecnológico de Los Mochis</h2>
        </div>
        <button class="btn-logout-admin" onclick="window.location.href='../index.html'">
            Cerrar Sesión
        </button>
    </header>

    <main class="admin-container">
        
        <div class="welcome-banner">
            <h3>Bienvenido, Administrador</h3>
            <p>Selecciona una opción del menú para continuar</p>
        </div>

        <div class="action-grid">
            
            <a href="#" class="action-card">
                <div class="icon-circle icon-blue">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <span>Registrar Docente</span>
            </a>
            
            <a href="#" class="action-card">
                <div class="icon-circle icon-orange">
                    <i class="fa-solid fa-book-open"></i>
                </div>
                <span>Registrar Materia</span>
            </a>

        </div>
    </main>

</body>
</html>
