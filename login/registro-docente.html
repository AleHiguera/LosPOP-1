<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Docente - ITLM</title>
    <link rel="stylesheet" href="panel-style.css">
    <link rel="stylesheet" href="registro-docente.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="admin-header">
        <div class="header-titles">
            <h1>Panel de Control - Personal</h1>
            <h2>Instituto Tecnológico de Los Mochis</h2>
        </div>
        <button class="btn-logout-admin" onclick="window.location.href='../index.html'">
            Cerrar Sesión
        </button>
    </header>

    <main class="admin-container">
        
        <div class="form-card">
            <div class="form-header">
                <h2>Registrar Nuevo Docente</h2>
                <p>Ingresa los datos correspondientes para dar de alta al personal.</p>
            </div>

            <form id="registroDocenteForm">
                <div class="form-row">
                    <label>Número de Empleado</label>
                    <input type="text" id="doc_num" placeholder="Ej. 12345" required>
                    <i class="fa-solid fa-check check-icon"></i>
                </div>

                <div class="form-row">
                    <label>Nombre Completo</label>
                    <input type="text" id="doc_nombre" required>
                    <i class="fa-solid fa-check check-icon"></i>
                </div>
                
                <div class="form-row">
                    <label>RFC</label>
                    <input type="text" id="doc_rfc" maxlength="13" style="text-transform: uppercase;" required>
                    <i class="fa-solid fa-check check-icon"></i>
                </div>
                
                <div class="form-row">
                    <label>Departamento</label>
                    <select id="doc_depto" required>
                        <option value="">Seleccione un área...</option>
                        <option value="Sistemas y Computación">Sistemas y Computación</option>
                        <option value="Ingeniería Industrial">Ingeniería Industrial</option>
                        <option value="Ciencias Básicas">Ciencias Básicas</option>
                        <option value="Ciencias Económico-Administrativas">Ciencias Económico-Administrativas</option>
                    </select>
                    <i class="fa-solid fa-check check-icon"></i>
                </div>

                <div class="form-row">
                    <label>Correo Institucional</label>
                    <input type="email" id="doc_correo" placeholder="ejemplo@itmochis.edu.mx" required>
                    <i class="fa-solid fa-check check-icon"></i>
                </div>

                <button type="submit" class="btn-submit">Guardar Registro</button>
            </form>

            <a href="panel-personal.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Volver al Panel</a>
        </div>

    </main>

    <script>
        const camposDocente = document.querySelectorAll('#registroDocenteForm input, #registroDocenteForm select');

        camposDocente.forEach(campo => {
            campo.addEventListener('input', function() {
                const iconoCheck = this.parentElement.querySelector('.check-icon');
                let esValido = false;

                if (this.id === 'doc_rfc') {
                    esValido = this.value.trim().length === 13;
                } 
                else if (this.type === 'email') {
                    esValido = this.value.includes('@') && this.value.includes('.');
                }
                else {
                    esValido = this.value.trim() !== '';
                }

                if (esValido) {
                    iconoCheck.classList.add('visible');
                } else {
                    iconoCheck.classList.remove('visible');
                }
            });
        });

        // Simulación de guardado
        document.getElementById('registroDocenteForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("¡Docente registrado correctamente en el sistema!");
            window.location.href = '../login/panel-personal.html'; 
        });
    </script>

</body>
</html>
