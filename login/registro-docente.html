<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Docente - ITLM</title>
    <link rel="stylesheet" href="../estilos/panel-personal-estilos.css">
    <link rel="stylesheet" href="../estilos/registro-docente.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="admin-header">
        <div class="header-titles">
            <h1>Panel de Control - Personal</h1>
            <h2>Instituto Tecnológico de Los Mochis</h2>
        </div>
        <button class="btn-logout-admin" onclick="window.location.href='../index.html'">
            Cerrar Sesión
        </button>
    </header>

    <main class="admin-container">
        
        <div class="form-card">
            <div class="form-header">
                <h2>Registrar Nuevo Docente</h2>
                <p>Ingresa los datos correspondientes para dar de alta al personal.</p>
            </div>

            <form id="registroDocenteForm">
                <div class="form-row">
                    <label>Número de Empleado</label>
                    <input type="text" id="doc_num" placeholder="Ej. 12345" required>
                    <i class="fa-solid fa-check check-icon"></i>
                </div>

                <div class="form-row">
                    <label>Nombre Completo</label>
                    <input type="text" id="doc_nombre" required>
                    <i class="fa-solid fa-check check-icon"></i>
                </div>
                
                <div class="form-row">
                    <label>RFC</label>
                    <input type="text" id="doc_rfc" maxlength="13" style="text-transform: uppercase;" required>
                    <i class="fa-solid fa-check check-icon"></i>
                </div>
                
                <div class="form-row">
                    <label>Departamento</label>
                    <select id="doc_depto" required>
                        <option value="">Seleccione un área...</option>
                        <option value="Sistemas y Computación">Sistemas y Computación</option>
                        <option value="Ingeniería Industrial">Ingeniería Industrial</option>
                        <option value="Ciencias Básicas">Ciencias Básicas</option>
                        <option value="Ciencias Económico-Administrativas">Ciencias Económico-Administrativas</option>
                    </select>
                    <i class="fa-solid fa-check check-icon"></i>
                </div>

                <div class="form-row">
                    <label>Correo Institucional</label>
                    <input type="email" id="doc_correo" placeholder="ejemplo@itmochis.edu.mx" required>
                    <i class="fa-solid fa-check check-icon"></i>
                </div>

                <button type="submit" class="btn-submit">Guardar Registro</button>
            </form>

            <a href="panel-personal.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Volver al Panel</a>
        </div>

    </main>

    <script>
    document.getElementById('registroDocenteForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const datos = {
            doc_num: document.getElementById('doc_num').value,
            doc_nombre: document.getElementById('doc_nombre').value,
            doc_rfc: document.getElementById('doc_rfc').value,
            doc_depto: document.getElementById('doc_depto').value,
            doc_correo: document.getElementById('doc_correo').value
        };

        try {
            const response = await fetch('http://localhost:3000/api/registrar-docente', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });

            if (response.ok) {
                alert("¡Docente registrado correctamente en el sistema!");
                window.location.href = 'panel-personal.html'; 
            } else {
                const errorData = await response.json();
                alert("Error: " + errorData.error);
            }
        } catch (error) {
            alert("No se pudo establecer conexión con el servidor.");
        }
    });

    // Mantener lógica visual de los iconos check
    document.querySelectorAll('#registroDocenteForm input, #registroDocenteForm select').forEach(campo => {
        campo.addEventListener('input', function() {
            const iconoCheck = this.parentElement.querySelector('.check-icon');
            if (this.value.trim() !== '') iconoCheck.classList.add('visible');
            else iconoCheck.classList.remove('visible');
        });
    });
</script>

</body>
</html>
