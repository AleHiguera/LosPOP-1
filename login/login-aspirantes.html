<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aspirantes ITLM</title>
    <link rel="stylesheet" href="../estilos/login-aspirantes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="icon-container">
                <i class="fa-solid fa-file-signature"></i>
            </div>
            
            <h2>PORTAL DE ADMISIÓN<br>Y REGISTRO</h2>
            
            <form id="loginAspirantesForm">
                <div class="input-group">
                    <input type="text" id="curp" placeholder="CURP" maxlength="18" required style="text-transform: uppercase;">
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Contraseña" maxlength="15" required>
                </div>
                
                <button type="submit" class="btn-main">Ingresar</button>
            </form>
            
            <div class="action-row">
                <a href="./requisitos.html" class="btn-small btn-gold">Nueva<br>Solicitud</a>
                <a href="#" class="btn-small btn-gold">Recuperar<br>Contraseña</a>
            </div>

            <a href="../index.html" class="link-salir">Salir</a>
        </div>

        <div class="footer-text">
            Registro Aspirantes | Aspirantes | © 2026
        </div>
    </div>

</body>
</html>
