<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Alumno - ITLM</title>
    <link rel="stylesheet" href="../estilos/tramites-estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="wrapper">
        <div class="tramite-card">
            <div class="icon-container">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            
            <h2>FORMULARIO DE ALUMNO</h2>
            
            <form id="registroForm">
    <div class="form-row">
        <label>Nombre Completo</label>
        <input type="text" id="in_nombre" required>
    </div>
    
    <div class="form-row">
        <label>CURP</label>
        <input type="text" id="in_curp" maxlength="18" style="text-transform: uppercase;" required>
    </div>
    
    <div class="form-row">
        <label>Correo</label>
        <input type="email" id="in_correo" required>
    </div>
    
    <div class="form-row">
        <label>Fecha de Nacimiento</label>
        <input type="date" id="in_fecha" required>
    </div>
    
    <div class="form-row">
        <label>Carrera</label>
        <input type="text" id="in_carrera" required>
    </div>

    <button type="submit" class="btn-main">Enviar Solicitud</button>
</form>

<script>
    document.getElementById('registroForm').addEventListener('submit', function(e) {
        e.preventDefault(); 

        localStorage.setItem('asp_nombre', document.getElementById('in_nombre').value.toUpperCase());
        localStorage.setItem('asp_curp', document.getElementById('in_curp').value.toUpperCase());
        localStorage.setItem('asp_correo', document.getElementById('in_correo').value);
        localStorage.setItem('asp_fecha', document.getElementById('in_fecha').value);
        localStorage.setItem('asp_carrera', document.getElementById('in_carrera').value);

        const folio = "ASP-2026-" + Math.floor(Math.random() * 90000 + 10000);
        localStorage.setItem('asp_folio', folio);

        window.location.href = 'ficha.html';
    });
</script>

            <div style="text-align: center;">
                <button type="reset" class="link-reset">Restablecer Formulario</button>
            </div>
        </div>
    </div>

</body>
</html>
