<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requisitos de Inscripción - ITLM</title>
    <link rel="stylesheet" href="tramites-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="wrapper">
        <div class="tramite-card">
            <div class="icon-container">
                <i class="fa-solid fa-file-circle-check"></i>
            </div>
            
            <h2>REQUISITOS DE INSCRIPCIÓN</h2>
            
            <div class="requisitos-list">
                <div class="req-item">
                    <div class="req-info">
                        <i class="fa-solid fa-file-lines"></i>
                        <div>
                            <strong>CERTIFICADO DE BACHILLERATO</strong>
                            <span>(Original y Copia)</span>
                        </div>
                    </div>
                    <a href="#" class="req-link">Mostrar Guía</a>
                </div>

                <div class="req-item">
                    <div class="req-info">
                        <i class="fa-solid fa-address-card"></i>
                        <div>
                            <strong>ACTA DE NACIMIENTO</strong>
                            <span>(Original y Copia)</span>
                        </div>
                    </div>
                    <a href="#" class="req-link">Mostrar Guía</a>
                </div>

                <div class="req-item">
                    <div class="req-info">
                        <i class="fa-solid fa-id-badge"></i>
                        <div>
                            <strong>CURP</strong>
                            <span>(Impresión reciente)</span>
                        </div>
                    </div>
                    <a href="#" class="req-link">Mostrar Guía</a>
                </div>

                <div class="req-item">
                    <div class="req-info">
                        <i class="fa-solid fa-camera"></i>
                        <div>
                            <strong>FOTOGRAFÍAS</strong>
                            <span>(6 tamaño infantil)</span>
                        </div>
                    </div>
                    <a href="#" class="req-link">Mostrar Guía</a>
                </div>

                <div class="req-item">
                    <div class="req-info">
                        <i class="fa-solid fa-file-invoice-dollar"></i>
                        <div>
                            <strong>COMPROBANTE DE PAGO</strong>
                            <span>(Inscripción)</span>
                        </div>
                    </div>
                    <a href="#" class="req-link">Mostrar Guía</a>
                </div>
            </div>

            <a href="formulario.html" class="btn-main" style="display: block; text-decoration: none; text-align: center;">Ir al Formulario</a>
        </div>
    </div>

</body>
</html>
