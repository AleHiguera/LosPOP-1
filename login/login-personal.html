<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Personal del Instituto</title>
    
    <link rel="stylesheet" href="estilos/login-estilos.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-wrapper">
        <h1 class="page-title">PERSONAL DEL INSTITUTO</h1>
        
        <div class="login-card">
            <div class="icon-container">
                <i class="fa-solid fa-users"></i>
            </div>
            
            <h2>ACCESO PARA EL<br>PERSONAL</h2>
            
            <form action="#">
                <div class="input-group">
                    <input type="text" placeholder="Nombre de Usuario" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Contraseña de Acceso" required>
                </div>
                
                <button type="submit" class="btn-login">Iniciar Sesión</button>
            </form>
            
            <a href="#" class="forgot-password">Restablecer Contraseña</a>
        </div>
    </div>
</body>
</html>
