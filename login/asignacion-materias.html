<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignación de Materias - ITLM</title>
    <link rel="stylesheet" href="../estilos/panel-personal-estilos.css">
    <link rel="stylesheet" href="../estilos/asignacion-materias.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="admin-header">
        <div class="header-titles">
            <h1>Asignación de Materias a Alumnos</h1>
        </div>
        <button class="btn-logout-admin" onclick="window.location.href='../login/panel-personal.html'">
            Regresar al Dashboard
        </button>
    </header>

    <main class="assignment-container">
        
        <aside class="sidebar-students">
            <div class="sidebar-card">
                <h3 class="section-title">Buscar Alumno</h3>
                <div class="search-box">
                    <input type="text" id="buscadorAlumnos" placeholder="Buscar por nombre o número de control...">
                </div>
                <div class="student-list" id="contenedor-alumnos"></div>
            </div>
        </aside>

        <section class="assignment-workspace">
            <div class="info-card selected-student-card">
                <h3 class="blue-title">Alumno Seleccionado</h3>
                <h2 class="student-name-large" id="top-nombre">Seleccione un alumno</h2>
                <p class="student-meta" id="top-meta">---</p>
                <p class="student-meta blue-text">Materias asignadas: <span id="counter-top">0</span>/8</p>
            </div>

            <div class="info-card">
                <div class="card-header">
                    <h3 class="section-title">Materias Asignadas (<span id="counter-title">0</span>/8)</h3>
                </div>
                <div id="lista-inscritas" class="subject-list"></div>
            </div>

            <div class="info-card">
                <div class="card-header flex-between">
                    <h3 class="section-title">Catálogo de Materias Disponibles</h3>
                    <select class="semester-filter">
                        <option>Todos los semestres</option>
                    </select>
                </div>
                <div id="lista-disponibles" class="subject-list scrollable-list"></div>
            </div>
        </section>
    </main>

    <script>
        const baseDatos = {
            alumnos: {},
            materias: {}
        };

        let alumnoSeleccionado = null;
        let materiasDelAlumno = []; // Array de IDs de materias asignadas al alumno actual

        // 1. Cargar alumnos desde el servidor
        async function cargarAlumnos() {
            try {
                const response = await fetch('http://localhost:3000/api/alumnos');
                const data = await response.json();
                
                data.forEach(alumno => {
                    baseDatos.alumnos[alumno.numero_control] = {
                        control: alumno.numero_control,
                        nombre: `${alumno.nombre} ${alumno.apellido_paterno} ${alumno.apellido_materno || ''}`,
                        carrera: alumno.carrera,
                        semestre: alumno.semestre ? `${alumno.semestre}° Semestre` : 'N/A'
                    };
                });
                renderizarBarraAlumnos();
            } catch (error) {
                console.error("Error al cargar alumnos:", error);
            }
        }

        // 2. Cargar Materias Directas desde el catálogo
        async function cargarMaterias() {
            try {
                const response = await fetch('http://localhost:3000/api/materias');
                const data = await response.json();
                
                data.forEach(mat => {
                    baseDatos.materias[mat.id] = {
                        id: mat.id,
                        nombre: `${mat.mat_clave} - ${mat.mat_nombre}`,
                        det: `Créditos: ${mat.mat_creditos} | Semestre: ${mat.mat_semestre} | Carrera: ${mat.mat_carrera}`,
                        horas: `T: ${mat.horas_t} / P: ${mat.horas_p} / Total: ${mat.horas_total}`
                    };
                });
                renderizarMaterias();
            } catch (error) {
                console.error("Error al cargar materias:", error);
            }
        }

        // 3. Obtener las materias asignadas a un alumno específico desde la BD
        async function cargarMateriasDelAlumno(numero_control) {
            try {
                const response = await fetch(`http://localhost:3000/api/alumnos/${numero_control}/materias`);
                materiasDelAlumno = await response.json(); // Retorna array de IDs, ej: [1, 4, 6]
                renderizarMaterias();
                actualizarContadores();
            } catch (error) {
                console.error("Error obteniendo materias del alumno:", error);
            }
        }

        // 4. Renderizar la barra lateral
        function renderizarBarraAlumnos() {
            const contenedor = document.getElementById('contenedor-alumnos');
            contenedor.innerHTML = '';
            Object.values(baseDatos.alumnos).forEach(alumno => {
                const activoClass = alumno.control === alumnoSeleccionado ? 'active' : '';
                contenedor.innerHTML += `
                    <div class="student-item ${activoClass}" onclick="seleccionarAlumno('${alumno.control}')" data-nombre="${alumno.nombre.toLowerCase()}" data-control="${alumno.control}">
                        <div class="student-name">${alumno.nombre}</div>
                        <div class="student-details">${alumno.control}</div>
                        <div class="student-details">${alumno.carrera} - ${alumno.semestre}</div>
                    </div>`;
            });
        }

        // 5. Seleccionar un alumno
        function seleccionarAlumno(idControl) {
            alumnoSeleccionado = idControl;
            const alumno = baseDatos.alumnos[idControl];
            
            document.querySelectorAll('.student-item').forEach(item => item.classList.remove('active'));
            const elementoSidebar = document.querySelector(`.student-item[data-control="${idControl}"]`);
            if (elementoSidebar) elementoSidebar.classList.add('active');
            
            document.getElementById('top-nombre').innerText = alumno.nombre;
            document.getElementById('top-meta').innerText = `${alumno.control} | ${alumno.carrera} | ${alumno.semestre}`;
            
            // Cargar sus asignaciones desde el backend
            cargarMateriasDelAlumno(idControl);
        }

        // 6. Renderizar Materias en el área principal
        function renderizarMaterias() {
            if (!alumnoSeleccionado) return;

            const listaInscritas = document.getElementById('lista-inscritas');
            const listaDisponibles = document.getElementById('lista-disponibles');
            
            listaInscritas.innerHTML = ''; 
            listaDisponibles.innerHTML = '';

            Object.values(baseDatos.materias).forEach(materia => {
                const estaInscrita = materiasDelAlumno.includes(materia.id);

                if (estaInscrita) {
                    listaInscritas.innerHTML += `
                        <div class="subject-card enrolled" id="mat-inc-${materia.id}">
                            <div class="subject-card-content">
                                <div class="subject-info">
                                    <h4 class="subject-name">${materia.nombre}</h4>
                                    <p class="subject-details">${materia.det}</p>
                                    <p class="subject-schedule">${materia.horas}</p>
                                </div>
                                <div class="subject-action">
                                    <button class="btn-rojo" onclick="desasignar(${materia.id})">Remover</button>
                                </div>
                            </div>
                        </div>`;
                }

                let htmlBoton = `<button class="btn-asignar" onclick="inscribir(${materia.id})">Asignar Materia</button>`;
                let estiloCard = '';

                if (estaInscrita) {
                    htmlBoton = `<button class="btn-disabled" disabled>Ya Asignada</button>`;
                    estiloCard = 'opacity: 0.6;';
                }

                listaDisponibles.innerHTML += `
                    <div class="subject-card" style="${estiloCard}">
                        <div class="subject-card-content">
                            <div class="subject-info">
                                <h4 class="subject-name">${materia.nombre}</h4>
                                <p class="subject-details">${materia.det}</p>
                                <p class="subject-schedule">${materia.horas}</p>
                            </div>
                            <div class="subject-action">
                                ${htmlBoton}
                            </div>
                        </div>
                    </div>`;
            });

            if (materiasDelAlumno.length === 0) {
                listaInscritas.innerHTML = `<p style="text-align:center; padding:20px; color:#64748b;">No hay materias asignadas.</p>`;
            }
        }

        function actualizarContadores() {
            const count = materiasDelAlumno.length;
            document.getElementById('counter-top').innerText = count;
            document.getElementById('counter-title').innerText = count;
        }

        // Buscador dinámico
        document.getElementById('buscadorAlumnos').addEventListener('input', e => {
            const b = e.target.value.toLowerCase();
            document.querySelectorAll('.student-item').forEach(c => {
                c.style.display = (c.dataset.nombre.includes(b) || c.dataset.control.includes(b)) ? 'block' : 'none';
            });
        });

        // 7. Enviar Asignación al servidor
        async function inscribir(idMateria) {
            if (!alumnoSeleccionado) return alert("Selecciona un alumno primero.");
            if (materiasDelAlumno.length >= 8) return alert("Límite máximo de 8 materias.");

            try {
                const response = await fetch('http://localhost:3000/api/asignar-materia', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ numero_control: alumnoSeleccionado, id_materia: idMateria })
                });

                if (response.ok) {
                    cargarMateriasDelAlumno(alumnoSeleccionado); // Recargar
                } else {
                    const data = await response.json();
                    alert(data.error || "Error al asignar");
                }
            } catch (error) {
                console.error("Error en petición POST:", error);
            }
        }

        // 8. Enviar Desasignación al servidor
        async function desasignar(idMateria) {
            try {
                const response = await fetch('http://localhost:3000/api/desasignar-materia', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ numero_control: alumnoSeleccionado, id_materia: idMateria })
                });

                if (response.ok) {
                    cargarMateriasDelAlumno(alumnoSeleccionado); // Recargar
                } else {
                    alert("Error al remover la materia");
                }
            } catch (error) {
                console.error("Error en petición DELETE:", error);
            }
        }

        // Inicialización
        window.onload = async () => {
            await cargarMaterias();
            await cargarAlumnos();
        };

    </script>
</body>
</html>
