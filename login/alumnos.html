<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Alumnos</title>
    <link rel="stylesheet" href="../estilos/login-alumnos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-wrapper">
        <p class="page-title">PÁGINA DE LOGIN: ALUMNOS</p>
        
        <div class="login-card">
            <div class="icon-circle">
                <i class="fa-solid fa-user-graduate"></i>
            </div>
            
            <h2 class="main-title">INICIAR SESIÓN COMO<br>ALUMNO</h2>
            
            <form id="loginAlumnosForm">
                <div class="input-container">
                    <label>No. Control</label>
                    <input type="text" id="ncontrol" required>
                </div>
                
                <div class="input-container">
                    <label>Contraseña</label>
                    <input type="password" id="password" required>
                </div>
                
                <button type="submit" class="btn-primary">Acceder al Portal</button>
            </form>
        </div>
        
        <div class="footer-info">
            Servicios Estudiantiles | Alumnos © 2026
        </div>
        
        <a href="../index.html" class="btn-back">Regresar</a>
    </div>

    <script>
        document.getElementById('loginAlumnosForm').addEventListener('submit', function(event) {
            event.preventDefault();
            window.location.href = "../login/portal-alumno.html"; 
        });
    </script>
</body>
</html>>
